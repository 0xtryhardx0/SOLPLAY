name: SolPlay CI/CD & Solana Devnet Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment to Solana Devnet'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: ⚡ SBF Build & Devnet Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install Solana CLI
        run: |
          echo "Installing Solana CLI v1.18.26..."
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Verify Solana CLI Installation
        run: |
          solana --version

      - name: Verify Contract Syntax & Unit Tests
        run: |
          echo "Running unit tests with no-entrypoint feature..."
          cargo test --features no-entrypoint --verbose

      - name: Build Solana SBF Bytecode
        run: |
          echo "Building SBF shared object via Solana toolchain..."
          cargo-build-sbf --sbf-out-dir target/deploy

      - name: Archive Compiled Program Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solplay-program-sbf
          path: target/deploy/solana_counter.so
          retention-days: 14

      - name: Deploy to Solana Devnet
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          DEVNET_KEYPAIR: ${{ secrets.SOLANA_DEVNET_KEYPAIR }}
          PROGRAM_KEYPAIR: ${{ secrets.SOLANA_PROGRAM_KEYPAIR }}
        run: |
          if [ -z "$DEVNET_KEYPAIR" ]; then
            echo "⚠️ [NOTICE] SOLANA_DEVNET_KEYPAIR secret is not configured in repository settings."
            echo "The smart contract bytecode (target/deploy/solana_counter.so) was successfully compiled and archived."
            echo "To enable automated Devnet deployment, add SOLANA_DEVNET_KEYPAIR to your GitHub repository secrets."
            exit 0
          fi

          echo "Configuring Solana RPC for Devnet..."
          solana config set --url https://api.devnet.solana.com

          echo "$DEVNET_KEYPAIR" > devnet_deployer.json
          chmod 600 devnet_deployer.json
          solana config set --keypair devnet_deployer.json

          echo "Checking deployer balance..."
          solana balance || solana airdrop 2 || true

          if [ -n "$PROGRAM_KEYPAIR" ]; then
            echo "$PROGRAM_KEYPAIR" > program_keypair.json
            chmod 600 program_keypair.json
            echo "Upgrading program on Devnet..."
            solana program deploy \
              --program-id program_keypair.json \
              --upgrade-authority devnet_deployer.json \
              target/deploy/solana_counter.so
          else
            echo "Deploying new program to Devnet..."
            solana program deploy \
              --upgrade-authority devnet_deployer.json \
              target/deploy/solana_counter.so
          fi

          echo "✅ Deployment completed successfully on Solana Devnet!"
