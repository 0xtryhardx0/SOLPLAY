<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Outfit:wght@900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 1280px;
    height: 288px;
    overflow: hidden;
  }
  svg {
    width: 1280px;
    height: 288px;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="solTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#9945FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="60%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Embedded Symbol (Left 60px) -->
  <g transform="translate(6, 6) scale(0.6)">
    <!-- Shield / Base -->
    <rect x="4" y="4" width="92" height="92" rx="26" fill="#080c18" stroke="url(#playGrad)" stroke-width="2" stroke-opacity="0.5"/>
    <!-- Central Solana Play Ribbons -->
    <path d="M 26 28 L 68 28 C 72 28 75 31 73 35 L 67 43 C 65 46 62 48 58 48 L 22 48 C 18 48 15 45 17 41 L 21 33 C 22 30 24 28 26 28 Z" fill="url(#playGrad)"/>
    <path d="M 38 41 L 78 50 C 82 51 82 56 78 58 L 38 67 C 34 68 31 65 32 61 L 34 47 C 35 43 36 41 38 41 Z" fill="url(#playGrad)" filter="url(#logoGlow)"/>
    <path d="M 33 60 L 69 60 C 73 60 76 63 74 67 L 70 75 C 69 78 66 80 62 80 L 20 80 C 16 80 13 77 15 73 L 19 65 C 21 62 23 60 26 60 Z" fill="url(#playGrad)"/>
    <!-- Specular highlight -->
    <polygon points="40,46 66,52 40,58 44,52" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Wordmark "SOLPLAY" -->
  <g transform="translate(76, 22)">
    <!-- SOL: Clean Bold White -->
    <text x="0" y="24" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="1.5" fill="#FFFFFF">SOL</text>
    <!-- PLAY: Vivid Solana Gradient -->
    <text x="64" y="24" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="1.5" fill="url(#solTextGrad)">PLAY</text>
    
    <!-- Subtitle: Protocol tag -->
    <text x="2" y="40" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="8.5" letter-spacing="3" fill="#64748b" text-transform="uppercase">
      SOLANA PREDICTION ARCADE
    </text>
  </g>
</svg>

<script>
window.addEventListener('load', async () => {
    await document.fonts.ready;
    console.log('FONTS_LOADED');
});
</script>
</body></html>
